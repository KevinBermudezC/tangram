name: CI

# Run on every pull request, plus on every push to main as a post-merge sanity check.
on:
  pull_request:
  push:
    branches: [main]

# Cancel any older runs for the same ref when a new push lands.
# Saves runner minutes when a contributor force-pushes rapidly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff format check + ruff check
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

  # ---------------------------------------------------------------------------
  # Test — pytest
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest

  # ---------------------------------------------------------------------------
  # OpenSpec — validate every active change
  # ---------------------------------------------------------------------------
  openspec:
    name: openspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the frontend job. The OpenSpec CLI itself runs on 18+,
          # but pinning both jobs to the same major keeps the cache key
          # consistent across the workflow.
          node-version: "22"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate every active change
        run: |
          set -e
          shopt -s nullglob
          for change_dir in openspec/changes/*/; do
            change_name=$(basename "$change_dir")
            # Skip the archive directory and any non-change directory
            if [ "$change_name" = "archive" ] || [ ! -f "$change_dir/.openspec.yaml" ]; then
              continue
            fi
            echo "Validating $change_name"
            openspec validate "$change_name" --strict
          done
        shell: bash

  # ---------------------------------------------------------------------------
  # Frontend — lint + typecheck + tests (pnpm via Corepack)
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Install pnpm BEFORE setup-node. Setup-node's `cache: pnpm` runs
      # `pnpm store path` to figure out what to cache; if pnpm isn't on
      # PATH yet, it records an empty path and then fails the post-job
      # cache-save step with a Path Validation Error.
      #
      # `pnpm/action-setup` reads `packageManager` from package.json, so
      # the version still stays pinned (no Corepack flake) and contributors
      # locally still use Corepack via the same `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # `packageManager` lives in `frontend/package.json` (not the
          # repo root), so we have to point the action at it explicitly.
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the minimum version declared in frontend/package.json's
          # `engines.node`. Next.js 16 + React 19 + Tailwind v4 dropped
          # support for older runtimes.
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test
